version: '3'

tasks:
  windows:build:
    summary: Builds the Komorebi Windows executable.
    cmds:
      - npm install --prefix frontend
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/GenerateBindings.ps1
      - npm run build --prefix frontend
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Force bin | Out-Null"
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/Komorebi.exe

  windows:run:
    summary: Runs the built Komorebi Windows executable.
    deps:
      - windows:build
    cmds:
      - bin/Komorebi.exe

  windows:sign:
    summary: Signs the Windows executable with a certificate thumbprint.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/SignWindows.ps1 -CertificateThumbprint "{{.CERT_THUMBPRINT}}"
    requires:
      vars:
        - CERT_THUMBPRINT

  windows:validate-release:
    summary: Validates the Windows release artifact. Pass ALLOW_UNSIGNED=true for local development builds.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ValidateRelease.ps1 {{if eq .ALLOW_UNSIGNED "true"}}-AllowUnsigned{{end}}

  build:
    summary: Builds the Komorebi Wails desktop executable.
    cmds:
      - task: windows:build

  run:
    summary: Runs the built Komorebi executable.
    deps:
      - build
    cmds:
      - bin/Komorebi.exe
