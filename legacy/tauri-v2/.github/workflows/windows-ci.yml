name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Windows build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Show toolchains
        shell: pwsh
        run: |
          node --version
          pnpm --version
          rustup show
          cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Install Tauri WebDriver tools
        shell: pwsh
        run: |
          cargo install tauri-driver --version 2.0.6 --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f5
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - name: Generated artifact guard
        run: pnpm check:artifacts

      - name: Frontend production advisory check
        run: pnpm security:frontend

      - name: Frontend production license inventory
        run: pnpm licenses:frontend

      - name: Rust advisory check
        run: pnpm security:rust

      - name: Root check
        run: pnpm check

      - name: Browser E2E smoke
        run: pnpm test:e2e

      - name: Tauri release executable build
        run: pnpm tauri build --no-bundle

      - name: Tauri WebDriver smoke
        run: pnpm test:tauri-webdriver
