# cargo-deny (CI: `cargo deny --locked check licenses advisories`).
# Only the Windows build's dependency graph counts.
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# RustSec: known vulnerabilities, unsound, unmaintained and yanked crates.
yanked = "deny"
ignore = []

[licenses]
# Komorebi is GPL-3.0-or-later. Allowed: permissive licenses (all GPLv3
# compatible), MPL-2.0 (file-level copyleft, GPLv3 compatible, used
# unmodified) and Slint's GPL-3.0 option (GPL-3.0-only; it is the licence
# taken for Slint). The Slint royalty-free licence stays allowed as an
# alternative in dual-licensed expressions. No GPL-2.0-only code is allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LicenseRef-Slint-Royalty-free-2.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
