name: Release

# A CI release build that Authenticode signing (SignPath) can sign.
#
# Runs when a version tag (v*) is pushed, or by hand (Actions > Release >
# Run workflow). It tests, builds the release exe (komorebi.exe, Komorebi
# 1.0), checks its size against 21,500,000 bytes, builds the installer
# around it, and keeps the UNSIGNED exe and installer as workflow artifacts
# with stable names (unsigned-exe, unsigned-installer), which a SignPath
# signing request takes as input. Then it attaches the packages to a DRAFT
# release. It never publishes a release.
#
# The in-app update signature (Ed25519) is NOT made here: the private key
# never goes to CI. It stays a manual local step on the maintainer's
# machine, done on the final, signed installer bytes (docs/RELEASING.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Also attach the packages to a draft release (v<version>)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  release:
    # GitHub's windows-2025 runner, free for public repositories (SignPath
    # signing needs builds made by GitHub Actions; see ci.yml). Inno Setup is
    # installed below when the image lacks it.
    runs-on: windows-2025
    permissions:
      # contents: write only to create the draft release; actions: read is
      # what SignPath needs to fetch the artifact (used once the signing
      # steps below are enabled).
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.95.0, pinned in rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
            Where-Object name -eq 'komorebi' | Select-Object -ExpandProperty version
          if (-not $version) { throw 'no komorebi package version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match the Cargo version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Komorebi $version"

      # fxc.exe for the app's shaders (see ci.yml).
      - name: Locate fxc.exe
        shell: pwsh
        run: ./scripts/find-fxc.ps1

      # The library (unit and integration tests).
      - name: cargo test
        run: cargo test --locked

      # The app's tests and the xtask gates run here too.
      - name: cargo test (app)
        run: |
          cargo test -p komorebi-gpui --locked
          cargo test -p xtask --locked

      # fxc.exe compiles the app's shaders here.
      - name: Release build
        run: cargo build --release --locked -p komorebi-gpui

      # The product budget (xtask/src/size.rs): komorebi.exe at most
      # 21,500,000 bytes.
      - name: Binary size
        run: cargo xtask size

      # One RT_MANIFEST (id 1) with PerMonitorV2 and the rest
      # (docs/GPUI-BUILD.md "The manifest").
      - name: Manifest
        shell: pwsh
        run: |
          ./scripts/check-manifest.ps1 target/release/komorebi.exe
          if ($LASTEXITCODE -ne 0) { throw 'komorebi.exe manifest' }

      # As in ci.yml: the app draws its first frame on WARP, offline.
      - name: GPUI boot check (WARP)
        shell: pwsh
        run: |
          ./scripts/gpui-boot-check.ps1 -Exe target/release/komorebi.exe `
            -Cache (Join-Path $env:RUNNER_TEMP 'gpui-boot.sqlite3') `
            -Out (Join-Path $env:RUNNER_TEMP 'gpui-boot.png') -Warp -Fallback -SkipIfNoDesktop
          if ($LASTEXITCODE -eq 4) { "::warning::GPUI boot check skipped: the runner session has no interactive desktop (run scripts/ci-local.ps1 locally)"; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw "GPUI boot check failed (exit $LASTEXITCODE)" }

      # As in ci.yml: the same on a seeded cache with the newest message
      # open; the folder pane, the list and the reading pane must all have
      # content.
      - name: GPUI boot check, seeded (WARP)
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'gpui-seed.sqlite3'
          cargo run --release --locked --example seed -- $db 2000
          if ($LASTEXITCODE -ne 0) { throw 'seeding failed' }
          ./scripts/gpui-boot-check.ps1 -Exe target/release/komorebi.exe `
            -Cache $db -Out (Join-Path $env:RUNNER_TEMP 'gpui-boot-mail.png') `
            -Warp -Fallback -SkipIfNoDesktop -Select 0
          if ($LASTEXITCODE -eq 4) { "::warning::GPUI seeded boot check skipped: the runner session has no interactive desktop (run scripts/ci-local.ps1 locally)"; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw "GPUI seeded boot check failed (exit $LASTEXITCODE)" }

      # The unsigned exe, uploaded alone under a stable name. SignPath
      # signs this first, because the installer wraps the exe.
      - name: Upload the unsigned exe
        id: upload-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: target/release/komorebi.exe
          if-no-files-found: error

      # ---------------------------------------------------------------
      # SIGNPATH, STEP 1 OF 2 (DISABLED): sign komorebi.exe.
      # Enable once the SignPath Foundation application is approved and
      # the placeholders below are filled in. Then the installer step
      # must use the signed exe (see the note on that step).
      # Needs the repository secret SIGNPATH_API_TOKEN.
      # ---------------------------------------------------------------
      # - name: Sign komorebi.exe with SignPath
      #   id: sign-exe
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     organization-id: '<SIGNPATH_ORGANIZATION_ID>'
      #     project-slug: '<SIGNPATH_PROJECT_SLUG>'
      #     signing-policy-slug: '<SIGNPATH_SIGNING_POLICY_SLUG>'
      #     github-artifact-id: '${{ steps.upload-exe.outputs.artifact-id }}'
      #     wait-for-completion: true
      #     output-artifact-directory: 'signed-exe'
      #
      # - name: Use the signed exe
      #   shell: pwsh
      #   run: Copy-Item signed-exe/komorebi.exe target/release/komorebi.exe -Force

      # Inno Setup 6, if the runner image does not have it. The script
      # compiles installer/komorebi.iss around target/release/komorebi.exe
      # (the signed copy, once the SignPath steps above are enabled), which
      # the setup installs as komorebi.exe, where 0.7 put it.
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'installing Inno Setup failed' }
          }
          ./scripts/build-installer.ps1 -Exe target/release/komorebi.exe -Version '${{ steps.version.outputs.version }}'

      - name: Upload the unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/komorebi-${{ steps.version.outputs.version }}-setup.exe
          if-no-files-found: error

      # ---------------------------------------------------------------
      # SIGNPATH, STEP 2 OF 2 (DISABLED): sign the installer.
      # Same placeholders and secret as step 1. The signed installer is
      # what the maintainer then signs for the in-app update, locally.
      # ---------------------------------------------------------------
      # - name: Sign the installer with SignPath
      #   id: sign-installer
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     organization-id: '<SIGNPATH_ORGANIZATION_ID>'
      #     project-slug: '<SIGNPATH_PROJECT_SLUG>'
      #     signing-policy-slug: '<SIGNPATH_SIGNING_POLICY_SLUG>'
      #     github-artifact-id: '${{ steps.upload-installer.outputs.artifact-id }}'
      #     wait-for-completion: true
      #     output-artifact-directory: 'signed-installer'
      #
      # - name: Use the signed installer
      #   shell: pwsh
      #   run: Copy-Item "signed-installer/komorebi-${{ steps.version.outputs.version }}-setup.exe" dist/ -Force

      # NOT DONE HERE: the Ed25519 update signature (.sig and .sha256 of
      # the final installer). The private key never goes to CI; the
      # maintainer makes both locally with `cargo run --example
      # sign_update -- sign <installer> <version>` on the final signed
      # installer and adds them to the draft release (docs/RELEASING.md).

      # The portable zip (the same exe as built above), the debug symbols as
      # their own asset, and checksums of everything in dist/.
      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $stage = Join-Path $env:RUNNER_TEMP "komorebi-$v"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/komorebi.exe (Join-Path $stage 'komorebi.exe')
          Copy-Item LICENSE (Join-Path $stage 'LICENSE.txt')
          Copy-Item NOTICE (Join-Path $stage 'NOTICE.txt')
          Copy-Item PRIVACY.md, README.md, CHANGELOG.md $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist/komorebi-$v-portable-x64.zip"
          if (Test-Path target/release/komorebi.pdb) {
            Copy-Item target/release/komorebi.pdb "dist/komorebi-$v.pdb"
          } else {
            Write-Warning 'no komorebi.pdb was written'
          }
          Push-Location dist
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          Pop-Location

      # The release notes: this version's section of CHANGELOG.md.
      - name: Release notes
        shell: pwsh
        run: |
          $v = [regex]::Escape('${{ steps.version.outputs.version }}')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$v\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw 'CHANGELOG.md has no section for this version' }
          Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'notes.md') $m.Groups[1].Value.Trim()

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: komorebi-${{ steps.version.outputs.version }}
          path: |
            dist/
            ${{ runner.temp }}/notes.md
            ${{ runner.temp }}/gpui-boot.png
            ${{ runner.temp }}/gpui-boot-mail.png
          if-no-files-found: error

      # A draft only: the maintainer reviews it, replaces the files with
      # the signed ones, adds the update signature files and publishes.
      - name: Attach to a draft release
        if: github.ref_type == 'tag' || inputs.create_draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          gh release create "v$v" --draft --title "Komorebi $v" `
            --notes-file (Join-Path $env:RUNNER_TEMP 'notes.md') `
            --target '${{ github.sha }}' @files
          if ($LASTEXITCODE -ne 0) { throw 'creating the draft release failed' }
