# The owner runs `pwsh -File scripts/ci-local.ps1` (the same steps as the jobs
# below, natively, on his own PC) before pushing, so this workflow does not
# run on every push. It runs on demand (Actions > CI > Run workflow) and on
# pull requests from forks, so outside contributors still get checked.
name: CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    # Komorebi is a Windows app: rust-toolchain.toml pins the
    # x86_64-pc-windows-msvc target. GitHub's windows-2025 runner (free
    # for public repositories) ships VS Build Tools 2022 (MSVC + Windows
    # SDK), which rusqlite's bundled SQLite build and
    # the exe's resources need, and the SDK's fxc.exe, which the app's
    # release build compiles its shaders with (docs/GPUI-BUILD.md). Pull requests
    # run only when they come from a fork: a branch of this repository was
    # checked locally.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.95.0 with rustfmt + clippy; the
      # dtolnay action ignores that file, so pass the pieces explicitly.
      - name: Install Rust (1.95.0, pinned in rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      # On GitHub-hosted runners rust-cache uses the normal Actions cache.
      - uses: Swatinem/rust-cache@v2

      # The app's release build compiles its shaders with the Windows
      # SDK's fxc.exe. Its build script finds the newest SDK by itself; this
      # step says which one (and sets GPUI_FXC_PATH to it), and fails early
      # with a clear message when the image has none.
      - name: Locate fxc.exe
        shell: pwsh
        run: ./scripts/find-fxc.ps1

      # Cheapest first. Clippy type-checks every target (it replaces a
      # separate cargo check), and cargo test builds the dev profile.
      - name: cargo fmt
        run: cargo fmt --all --check

      # Lints in the workspace (the library, the app in crates/komorebi-gpui;
      # not the vendored third_party crates) are errors. The imap-proto future-incompat notice (transitive, via the
      # imap crate) is a cargo report, not a lint, so it does not fail
      # this step.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The app on its own (clippy above covers it with the workspace): a
      # plain check of every target, so a clippy-only pass never hides a
      # build error.
      - name: cargo check (app)
        run: cargo check -p komorebi-gpui --all-targets --locked

      # The app's source lints: colours and sizes only from the token layer,
      # no timers or sleeps (xtask/src/lint.rs, docs/GPUI-TESTING.md).
      - name: GPUI lints
        run: cargo xtask lint

      # The library (unit and integration tests).
      - name: cargo test
        run: cargo test --locked

      # The app's tests run on GPUI's headless test platform; the DirectX
      # pre-flight test uses WARP, so no GPU is needed. komorebi-i18n is the
      # catalog the app reads (tr!, trn!). Then the xtask crate's own tests
      # (the lints and size gates).
      - name: cargo test (app)
        run: |
          cargo test -p komorebi-gpui -p komorebi-i18n --locked
          cargo test -p xtask --locked

      # The exact-pinned renderer crates must stay single copies.
      - name: Pin consistency
        shell: pwsh
        run: ./scripts/check-pins.ps1

      # komorebi.exe (Komorebi 1.0, the release exe; fxc.exe compiles its
      # shaders here).
      - name: Release build
        run: cargo build --release --locked -p komorebi-gpui

      # The product budget, decimal bytes (xtask/src/size.rs): komorebi.exe
      # at most 21,500,000.
      - name: Binary size
        run: cargo xtask size

      # One RT_MANIFEST (id 1), with PerMonitorV2 and what GPUI's own
      # manifest carried (docs/GPUI-BUILD.md "The manifest").
      - name: Manifest
        shell: pwsh
        run: |
          ./scripts/check-manifest.ps1 target/release/komorebi.exe
          if ($LASTEXITCODE -ne 0) { throw 'komorebi.exe manifest' }

      # The app's boot check: offline on a new throwaway cache, drawn
      # with WARP (the runner has no GPU), its first frame captured
      # (PrintWindow) and checked, exit 0. A runner whose agent runs as a
      # service has no interactive desktop, so GPUI cannot open a window:
      # -SkipIfNoDesktop turns that into exit 4 and a warning (seen on the
      # first 1.0 run on Blacksmith). scripts/ci-local.ps1 runs it for real.
      # -Fallback: a blank first run is tried again with
      # GPUI_DISABLE_DIRECT_COMPOSITION=1 (the runner's DWM may not compose
      # DirectComposition surfaces); the log says which mode passed.
      - name: GPUI boot check (WARP)
        shell: pwsh
        run: |
          ./scripts/gpui-boot-check.ps1 -Exe target/release/komorebi.exe `
            -Cache (Join-Path $env:RUNNER_TEMP 'gpui-boot.sqlite3') `
            -Out (Join-Path $env:RUNNER_TEMP 'gpui-boot.png') -Warp -Fallback -SkipIfNoDesktop
          if ($LASTEXITCODE -eq 4) { "::warning::GPUI boot check skipped: the runner session has no interactive desktop (run scripts/ci-local.ps1 locally)"; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw "GPUI boot check failed (exit $LASTEXITCODE)" }

      # The same on a seeded cache with the newest message open: the folder
      # pane, the list and the reading pane all have content
      # (snapshot::blank_panes).
      - name: GPUI boot check, seeded (WARP)
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'gpui-seed.sqlite3'
          cargo run --release --locked --example seed -- $db 2000
          if ($LASTEXITCODE -ne 0) { throw 'seeding failed' }
          ./scripts/gpui-boot-check.ps1 -Exe target/release/komorebi.exe `
            -Cache $db -Out (Join-Path $env:RUNNER_TEMP 'gpui-boot-mail.png') `
            -Warp -Fallback -SkipIfNoDesktop -Select 0
          if ($LASTEXITCODE -eq 4) { "::warning::GPUI seeded boot check skipped: the runner session has no interactive desktop (run scripts/ci-local.ps1 locally)"; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw "GPUI seeded boot check failed (exit $LASTEXITCODE)" }

      # What UI Automation (Narrator) reads on the GPUI window.
      # Informational (GPUI-MIGRATION.md phase 13).
      - name: GPUI UI Automation dump
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/gpui-uia-check.ps1 -Exe target/release/komorebi.exe `
            -Cache (Join-Path $env:RUNNER_TEMP 'gpui-uia.sqlite3') -Warp `
            -DumpPath (Join-Path $env:RUNNER_TEMP 'gpui-uia.txt')
          if ($LASTEXITCODE -ne 0) { throw "UIA check failed (exit $LASTEXITCODE)" }

      # A convenience copy only: a full artifact storage quota must not
      # fail a build whose checks passed.
      - name: Upload the boot snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: boot-snapshot
          path: |
            ${{ runner.temp }}/gpui-boot.png
            ${{ runner.temp }}/gpui-boot.png.log
            ${{ runner.temp }}/gpui-boot-mail.png
            ${{ runner.temp }}/gpui-boot-mail.png.log
            ${{ runner.temp }}/gpui-uia.txt
          if-no-files-found: ignore

  # Licenses (deny.toml) and RustSec advisories for the Windows graph of
  # the whole workspace.
  # No compile here.
  deny:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.95.0, pinned in rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny
        run: cargo deny --workspace --locked check licenses advisories
