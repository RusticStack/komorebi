name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    # Komorebi is a Windows app: rust-toolchain.toml pins the
    # x86_64-pc-windows-msvc target, and windows-latest ships the MSVC
    # toolchain + Windows SDK that Slint's winit backend and rusqlite's
    # bundled SQLite build need.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.95.0 with rustfmt + clippy; the
      # dtolnay action ignores that file, so pass the pieces explicitly.
      - name: Install Rust (1.95.0, pinned in rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Cheapest first. Clippy type-checks every target (it replaces a
      # separate cargo check), and cargo test builds the dev profile.
      - name: cargo fmt
        run: cargo fmt --check

      # Clippy is clean in src/; the only remaining warning is a third-party
      # future-incompat notice from imap-proto (transitive via the imap crate),
      # which is not actionable here. Keep -D warnings off only because of that
      # transitive notice.
      - name: cargo clippy
        run: cargo clippy --all-targets --locked

      - name: cargo test
        run: cargo test --locked
