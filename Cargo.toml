[package]
name = "komorebi"
version = "1.1.2"
edition = "2024"
description = "A small, fast, privacy-respecting email client for Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/RusticStack/komorebi"

[workspace]
# This package is the library (src/lib.rs and below): the mail engine, the
# cache and the Win32 shell code. crates/komorebi-gpui is the app, the
# `komorebi` exe (Komorebi 1.0, docs/GPUI-MIGRATION.md).
# crates/komorebi-i18n is the catalog the app and the library read (tr!, trn!).
# xtask holds its development gate (`cargo xtask check`, docs/GPUI-TESTING.md).
members = ["crates/komorebi-gpui", "crates/komorebi-i18n", "xtask"]
# Vendored upstream crates are path patches, never members: no Komorebi
# fmt, clippy or tests run on them (third_party/README.md).
exclude = ["third_party"]

[workspace.dependencies]
# The GPUI stack, pinned as a pair (as in Skua): gpui-pre is imported as
# `gpui`; gpui-kit with its default features (component, assets).
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-kit = { version = "=0.8.0" }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
imap = "2.4"
imap-proto = "0.10"  # already used by imap; named for its Capability type
# The credential API; the Windows store is below. (The `keyring` wrapper
# enabled the store's `search` feature, which linked `regex`.)
keyring-core = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "native-tls", "smtp-transport"] }
# full_encoding decodes legacy CJK charsets (ISO-2022-JP, Big5, GB2312, ...).
mail-parser = { version = "0.11", features = ["full_encoding"] }
native-tls = "0.2"
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
# The display language and the catalog for Rust code (tr!, trn!), read from
# the .po files (docs/GPUI-I18N.md). No dependencies.
komorebi-i18n = { path = "crates/komorebi-i18n" }
# HTML renderer (src/mail/render). Pinned to the exact locked version so no
# second copy appears.
gif = "=0.14.2"
image-webp = "=0.2.4"
parley = "=0.11.1"
png = "=0.18.1"
skrifa = "=0.44.0"
tiny-skia = "=0.12.0"
# Caps characters per grapheme cluster before shaping (parley counts them
# in a u8). Pinned to the locked version.
unicode-segmentation = "=1.13.3"
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"
# Link checks parse URLs as browsers do (host in xn-- form, numeric IPs).
# Already linked through lettre; pinned to the locked version.
url = "=2.5.8"
# The sender notice shows an xn-- domain in its Unicode form. Already linked
# through url; pinned to the locked version.
idna = "=1.1.0"
# "Find settings" reads a provider's autoconfig file. Already linked through
# resvg (GPUI's SVG icons); pinned to the locked version.
roxmltree = "=0.21.1"
# Update check (src/update.rs): the installer's SHA-256 and its Ed25519
# signature against the public key compiled into the app. Both small and
# pure Rust; no key generation or randomness in the app.
ed25519-compact = { version = "2.6.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
# Pictures pasted as data: addresses and copied out the same way (the
# composer's clipboard). Already linked through lettre; the same version.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager, the store `keyring` v4 used: pinned, so saved
# passwords keep their credential names. No `search` (it links `regex`).
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
# SChannel, already linked through native-tls: the certificate review reads
# the chain the server presented (src/mail/pin.rs), which native-tls hides.
# Pinned to the copy native-tls links.
schannel = "=0.1.29"
# ShellExecuteW, to open a confirmed http(s) link in the default browser or
# an opened attachment; CreateMutexW (Threading, Security) and FindWindowW
# for one app per cache; GetClipboardData (DataExchange) and GlobalLock
# (Memory) to paste copied files; EnumDisplayMonitors (Graphics_Gdi) to keep
# a restored window on a monitor; FlashWindowEx for the opt-in taskbar flash;
# DwmSetWindowAttribute (Graphics_Dwm) for a title bar that follows the theme;
# RegGetValueW (System_Registry), SystemParametersInfoW and HIGHCONTRASTW
# (UI_Accessibility) and GetSysColor to follow the Windows appearance
# settings (src/theme.rs) (ProcessStatus: examples/peak_memory only);
# the DNS record types and LoadLibraryExW/GetProcAddress for the SRV lookup of
# "Find settings" (src/mail/discover.rs), which loads dnsapi.dll on a click;
# GetUserPreferredUILanguages (Globalization) for the display language
# (src/i18n.rs); SetPropW/GetPropW (WindowsAndMessaging) mark the window of an
# instance. The app-drawn title bar (src/chrome.rs): GetDpiForWindow,
# GetSystemMetricsForDpi and AdjustWindowRectExForDpi (UI_HiDpi) and
# TrackMouseEvent (UI_Input_KeyboardAndMouse).
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_Dns", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
# Honor KOMOREBI_PASSWORD (with KOMOREBI_DB) in release builds too.
dev-env-password = []

[dev-dependencies]
# examples/sign_update.rs keygen: a random seed (tests use fixed seeds).
ed25519-compact = { version = "2.6.0", default-features = false, features = ["std", "random"] }

# Speed first (owner's decision, 2026-11-07): the exe's size matters least;
# responsiveness, memory and CPU matter most. Everything is built at
# opt-level 3 (the reader's raster and text stack, SQLite, the mail engine,
# GPUI and the views).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Code that is cold or runs once per user action (the update check's SHA-256
# and Ed25519 signature, once per update; SVG and XML parsing of icons and
# autoconfig files; the SMTP client) takes "z": it holds no loop that
# matters, and it keeps the exe under the 21,500,000-byte ceiling
# (xtask/src/size.rs) at opt-level 3 everywhere else.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.release.package.sha2]
opt-level = "z"

[profile.release.package.usvg]
opt-level = "z"

[profile.release.package.resvg]
opt-level = "z"

[profile.release.package.svgtypes]
opt-level = "z"

[profile.release.package.simplecss]
opt-level = "z"

[profile.release.package.roxmltree]
opt-level = "z"

[profile.release.package.lettre]
opt-level = "z"

# The UI stack builds the element tree and lays it out every frame (taffy,
# GPUI's window and elements, Kit, the views). Measured against opt-level 3:
# scroll and typing frames are 7 to 10 percent faster at "s" (smaller code,
# fewer instruction cache misses), the reader's open to first tile is about
# 5 ms slower (within its floor). The reader, the text stack, tiny-skia and
# SQLite stay at 3.
[profile.release.package.gpui-pre]
opt-level = "s"

[profile.release.package.gpui-pre-windows]
opt-level = "s"

[profile.release.package.gpui-pre-platform]
opt-level = "s"

[profile.release.package.gpui-pre-collections]
opt-level = "s"

[profile.release.package.gpui-pre-sum-tree]
opt-level = "s"

[profile.release.package.gpui-pre-refineable]
opt-level = "s"

[profile.release.package.gpui-pre-shared-string]
opt-level = "s"

[profile.release.package.gpui-pre-scheduler]
opt-level = "s"

[profile.release.package.taffy]
opt-level = "s"

[profile.release.package.gpui-component]
opt-level = "s"

[profile.release.package.gpui-base]
opt-level = "s"

[profile.release.package.gpui-kit]
opt-level = "s"

[profile.release.package.komorebi-gpui]
opt-level = "s"

# The GPUI stack's owner-approved patches of published crates (as in Skua):
# each third_party/<crate> is the exact crates.io source plus the diffs its
# SKUA-PATCH.md and KOMOREBI-PATCH.md describe (third_party/README.md).
[patch.crates-io]
gpui-pre-windows = { path = "third_party/gpui-pre-windows" }
gpui-pre = { path = "third_party/gpui-pre" }
# gpui-kit is a facade; the hooks live in gpui-component.
gpui-component = { path = "third_party/gpui-component" }
# The unstyled base under Kit (the dialog host's name, Komorebi's patch).
gpui-base = { path = "third_party/gpui-base" }

# Dependencies (GPUI, the HTML renderer, SQLite) are unusably slow
# unoptimized; optimize them in debug builds and keep our own crates fast to
# rebuild.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
