[package]
name = "komorebi"
version = "0.2.0"
edition = "2024"
description = "A small, fast, privacy-respecting email client for Windows"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
imap = "2.4"
keyring = { version = "4" }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "native-tls", "smtp-transport"] }
mail-parser = "0.11"
native-tls = "0.2"
rfd = { version = "0.17", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Slint's software renderer is unusably slow unoptimized; optimize
# dependencies in debug builds and keep our own crate fast to rebuild.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
